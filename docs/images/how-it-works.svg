<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="How ProofLoop works: interpret, snapshot before, agent runs, snapshot after, deterministic verdict">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="330" rx="22" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="50" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">How ProofLoop works</text>
  <text x="40" y="76" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#64748b">The verdict comes from independent evidence - never from the agent's own report.</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
    <!-- step boxes: x = 40 + i*246, width 206 -->
    <g transform="translate(40 104)">
      <rect width="206" height="168" rx="16" fill="#eef2ff" stroke="#c7d2fe"/>
      <circle cx="30" cy="32" r="16" fill="#6366f1"/><text x="30" y="37.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">1</text>
      <text x="56" y="38" font-size="17" font-weight="800" fill="#1e1b4b">Interpret</text>
      <text x="18" y="74" font-size="13.5" fill="#334155">Task → validated</text>
      <text x="18" y="94" font-size="13.5" fill="#334155">verification plan</text>
      <text x="18" y="124" font-size="12" fill="#64748b">rules first, LLM for</text>
      <text x="18" y="142" font-size="12" fill="#64748b">free-form, then guard rails</text>
    </g>
    <line x1="252" y1="188" x2="280" y2="188" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(286 104)">
      <rect width="206" height="168" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
      <circle cx="30" cy="32" r="16" fill="#0891b2"/><text x="30" y="37.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">2</text>
      <text x="56" y="38" font-size="17" font-weight="800" fill="#164e63">Before</text>
      <text x="18" y="74" font-size="13.5" fill="#334155">Backup + snapshot via</text>
      <text x="18" y="94" font-size="13.5" fill="#334155">a read-only channel</text>
      <text x="18" y="124" font-size="12" fill="#64748b">mode=ro SQLite, read-only</text>
      <text x="18" y="142" font-size="12" fill="#64748b">API token, file checksums</text>
    </g>
    <line x1="498" y1="188" x2="526" y2="188" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(532 104)">
      <rect width="206" height="168" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
      <circle cx="30" cy="32" r="16" fill="#7c3aed"/><text x="30" y="37.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">3</text>
      <text x="56" y="38" font-size="17" font-weight="800" fill="#3b0764">Agent runs</text>
      <text x="18" y="74" font-size="13.5" fill="#334155">Any agent; every tool</text>
      <text x="18" y="94" font-size="13.5" fill="#334155">call is policy-checked</text>
      <text x="18" y="124" font-size="12" fill="#64748b">recorded in an append-only,</text>
      <text x="18" y="142" font-size="12" fill="#64748b">SHA-256 hash-chained trace</text>
    </g>
    <line x1="744" y1="188" x2="772" y2="188" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(778 104)">
      <rect width="206" height="168" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
      <circle cx="30" cy="32" r="16" fill="#0891b2"/><text x="30" y="37.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">4</text>
      <text x="56" y="38" font-size="17" font-weight="800" fill="#164e63">After</text>
      <text x="18" y="74" font-size="13.5" fill="#334155">Second independent</text>
      <text x="18" y="94" font-size="13.5" fill="#334155">snapshot, then diff</text>
      <text x="18" y="124" font-size="12" fill="#64748b">side effects attributed to</text>
      <text x="18" y="142" font-size="12" fill="#64748b">the logged tool calls</text>
    </g>
    <line x1="990" y1="188" x2="1018" y2="188" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(1024 104)">
      <rect width="216" height="168" rx="16" fill="#0f172a"/>
      <rect width="216" height="6" rx="3" fill="url(#accent)"/>
      <circle cx="30" cy="32" r="16" fill="url(#accent)"/><text x="30" y="37.5" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">5</text>
      <text x="56" y="38" font-size="17" font-weight="800" fill="#f8fafc">Verdict</text>
      <text x="18" y="74" font-size="13" fill="#cbd5e1">Deterministic rules R1-R6</text>
      <g font-size="12" font-weight="700">
        <rect x="18" y="88" width="88" height="22" rx="11" fill="#052e1c" stroke="#10b981"/><text x="62" y="103" fill="#6ee7b7" text-anchor="middle">VERIFIED</text>
        <rect x="112" y="88" width="80" height="22" rx="11" fill="#3b0d0d" stroke="#ef4444"/><text x="152" y="103" fill="#fca5a5" text-anchor="middle">FAILED</text>
        <rect x="18" y="116" width="120" height="22" rx="11" fill="#3a2506" stroke="#f59e0b"/><text x="78" y="131" fill="#fcd34d" text-anchor="middle">INCONCLUSIVE</text>
      </g>
      <text x="18" y="156" font-size="12" fill="#94a3b8">+ evidence-backed report</text>
    </g>
  </g>

  <text x="40" y="306" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">No LLM decides a verdict. Missing or contradictory evidence is INCONCLUSIVE - never silently turned into a pass or a fail.</text>
</svg>
